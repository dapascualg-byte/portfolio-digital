    <title>Diego A. Pascual García | Artista Digital - Galería de retratos y pinturas digitales</title>

    <style>
        /* General styles */
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #374151;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Dark Mode */
        html.dark body {
            background-color: #111827;
            color: #d1d5db;
        }
        html.dark aside {
             background-color: #1f2937;
             border-color: #374151;
        }
        html.dark header h1, html.dark .nav-link.active, html.dark .filter-btn.active-filter {
            color: #ffffff;
        }
        html.dark header p, html.dark .nav-link, html.dark .filter-btn, html.dark .text-sm, html.dark .text-xs {
            color: #9ca3af;
        }
        html.dark .gallery-item {
            background-color: #374151;
        }
        html.dark h2, html.dark .text-lg {
            color: #f9fafb;
        }

        /* Gallery Item Interaction - Versión compacta */
        .gallery-item {
            position: relative;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }
        .image-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }
        .image-container img {
            transition: transform 0.4s ease;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; 
        }
        .gallery-item:hover .image-container img {
            transform: scale(1.08);
        }
        
        /* Capa invisible de protección contra descarga */
        .no-download-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            padding: 8px;
            text-align: center;
            z-index: 6;
        }
        .gallery-item:hover .overlay {
            opacity: 1;
        }
        .overlay-icon {
            width: 30px;
            height: 30px;
            margin-bottom: 6px;
        }
        .overlay-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        /* Nav Link Style */
        .nav-link.active, .filter-btn.active-filter {
            font-weight: 700;
        }

        /* Header Font */
        header h1 {
            font-family: 'Raleway', sans-serif;
        }
        
        /* Sold Label */
        .sold-label {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background-color: rgba(220, 38, 38, 0.85);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 10;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInFromLeft {
            from { opacity: 0; transform: translateX(-100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        aside {
            opacity: 0;
            animation: slideInFromLeft 0.8s ease-out forwards;
        }
    </style>
